<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Idul Adha 1447 H - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" role="img" aria-label="Animasi Idul Adha 1447H dengan langit malam, bulan sabit, dan hewan ternak">
    <div class="sky"></div>
    <div class="stars-layer" id="starsLayer"></div>
    <div class="fireflies" id="fireflies"></div>

    <div class="moon-wrap">
        <div class="moon-glow"></div>
        <div class="moon-crescent">
            <div class="moon-outer"></div>
            <div class="moon-cut"></div>
        </div>
        <div class="star-top">✦</div>
    </div>

    <div class="title-area">
        <div class="title-arabic">عيد الأضحى المبارك</div>
        <div class="title-main">Selamat Hari Raya<br>Idul Adha</div>
        <div class="title-year">1447 H &nbsp;·&nbsp; 2026</div>
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line right"></div>
        </div>
        <div class="tagline">Semoga ibadah qurban kita diterima Allah SWT</div>
    </div>

    <div class="landscape">
        <div class="hill-bg"></div>
        <div class="hill-mid"></div>
        <div class="hill-mid2"></div>
        
        <div class="mosque-silhouette">
            <div class="minaret minaret-short"></div>
            <div style="width:8px"></div>
            <div class="dome-body"><div class="dome-top"></div><div class="dome-base"></div></div>
            <div style="width:8px"></div>
            <div class="minaret minaret-tall"></div>
            <div style="width:4px"></div>
            <div class="dome-body">
                <div class="dome-top" style="width:45px;height:25px"></div>
                <div class="dome-base" style="width:60px;height:25px"></div>
            </div>
            <div style="width:4px"></div>
            <div class="minaret minaret-tall"></div>
            <div style="width:8px"></div>
            <div class="dome-body"><div class="dome-top"></div><div class="dome-base"></div></div>
            <div style="width:8px"></div>
            <div class="minaret minaret-short"></div>
        </div>
        
        <div class="hill-fg"></div>
        <div class="ground"></div>
    </div>

    <div class="palm palm-l">🌴</div>
    <div class="palm palm-r">🌴</div>

    <div class="animals-layer">
        <div class="animal animal-camel">🐪</div>
        <div class="animal animal-cow">🐄</div>
        <div class="animal animal-goat">🐐</div>
        <div class="animal animal-sheep">🐑</div>
    </div>

    <div class="watermark">
        <div class="wm-dot"></div>
        <div class="wm-text">BY <span class="wm-name">MZKYZAK</span></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
